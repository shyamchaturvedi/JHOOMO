name: milo_mobile
description: "JHOOMO — Milna Aasaan. Events Yaadgaar. Privacy Tumhari."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  app_links: ^6.3.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  google_sign_in: ^6.2.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  razorpay_flutter: ^1.3.7
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
